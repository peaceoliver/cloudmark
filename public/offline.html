<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <title>CloudMark – nincs kapcsolat</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark light; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f19; color: #e2e8f0;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        @media (prefers-color-scheme: light) { body { background: #f8fafc; color: #0f172a; } }
        img { width: 72px; height: 72px; margin-bottom: 16px; }
        h1 { font-size: 1.3rem; margin: 0 0 8px; }
        p { margin: 0 0 20px; opacity: .75; max-width: 320px; line-height: 1.5; }
        a { display: inline-block; padding: 10px 20px; border-radius: 10px; background: #0284c7; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Nincs internetkapcsolat</h1>
        <p>A CloudMark az adataidat a felhőből tölti be. Amint újra lesz kapcsolat, az oldal magától visszatér.</p>
        <a href="/">Újrapróbálás</a>
    </main>
    <script src="/js/offline.js"></script>
</body>
</html>
